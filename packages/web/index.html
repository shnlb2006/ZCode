    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161616" />
    <meta name="color-scheme" content="dark" />
    <!-- Bugfix: Chrome dev 下可能不发 favicon 网络请求；内嵌小尺寸 App 图标，避免标签页回退到默认图标。 -->

      rel="icon"
      type="image/png"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAC50lEQVRYhc2XbUhTURjH55ftbhYWFSKJFffafIHMhN3rppk2Z9oKTSkyMaSIMA3NhVYmq0zthQzLyhrKsiQJ7UO5+mJlaogW0peCgj4GIqYUVNDmP87Nje7ecnN3+MD/04Xz/z3POc+5z5FIFmVEJCmkNLuTotljFMNWL0Ryhqska5E152MdQtFslYxhpymGQyBF1iQwxMOjuYxm7wXa2AWE5jrdQlA0WyW2uV1yhqtw2XOZCGX3sh1fJZGc3OEvZbgdwTK3Sxqt2v5P+VWGYAOQDnMAyGjWKKbZig0ZUCjVwm2gWaNoALHp+Thw/Ayum7vR3vsEuhuNoKKTxQEIT9Qip7gc9S0m9D0fwtT0DEj8tlrR0P0A6ZZWxFSXuR5EfwCWKDXYlF2II7VNuP/IgvefPmN2dhbO8e7DR2ypOwHdcDuyx8xYrs7yD2CdWo/8QwY+u/7hUfz4+Qvegnw/e82ExMsnkf3mLi+uo8FtMl4BQpVq9Fj64UsMjLzFxj37kdrb7DAnWlNS7DsAxXAIi0udF8TMt+8wnGtGVOE+ZL66IzDPHDQhND7FPwBqrhK3u3o9mlteDIFJy0N8XYXA2K6ECzUez5NPh/DUxVaB8cTkFN9mYSotNF2X3JoThefkBgaAYjiU1TbBarWhs6cPEUk6ROQWYGv/LY/maY9bXHp/wW04NDaOZfGbsVaXj8wB4X47S2ko9bqWXwDGK238LTc4Oo7GNjOSrp52a75t1IwwVht4AM2uEmj3HsaXiUn+LNzsfIjVBbuR/rRVAKAy1f93Lb8AFOvVyDtYBZvNhmcvX2NVQsbfbolLQWxNObJGOniAqOIicQAohoOuqJT/yRAY528rtXqwHeehiNWIB7A0xv3F4qsEAFQQ50G75ibkRTKSSYI9lNLslGAoJUFKErzs2aMSNxFCHg2iZ8+wZq+vIznDVZK5XYyyz2Xu0VziiEhOLmWS9TwMzTUtRPzjlEnWu+z5Yok/1PZ75bNE7BkAAAAASUVORK5CYII="
      sizes="32x32"
    />
    <title>ZCode</title>
    <script>
      (() => {
        // Bugfix: Web 远控跨 workspace 跳转时，JS bundle 还没执行前就会先渲染启动壳。
        // 这里提前按本地主题偏好决定首屏底色，避免 dark 用户在这一帧看到白底闪烁。
        const STORAGE_KEY = "zcode-theme";
        const DEFAULT_THEME = "zai-dark";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f8f8f8",
        };
        const BOOTSTRAP_SNAPSHOT_KEY = "zcode:web-remote-control:bootstrap-shell";

        const normalizeResolvedTheme = (theme) => {
          if (theme === "dark") return "dark";
          if (theme === "light") return "light";
          if (theme === "zai-dark") return "dark";
          if (theme === "zai-light") return "light";
          return theme;
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-zcode-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        try {
          let bootstrapTheme = null;
          const bootstrapSnapshotRaw = window.sessionStorage.getItem(BOOTSTRAP_SNAPSHOT_KEY);
          if (bootstrapSnapshotRaw) {
            window.sessionStorage.removeItem(BOOTSTRAP_SNAPSHOT_KEY);
            try {
              const snapshot = JSON.parse(bootstrapSnapshotRaw);
              if (snapshot && typeof snapshot === "object") {
                const normalizedTheme = snapshot.theme === "dark" ? "dark" : "light";
                bootstrapTheme = normalizedTheme;
                document.documentElement.style.setProperty(
                  "--zcode-bootstrap-bg",
                  typeof snapshot.background === "string"
                    ? snapshot.background
                    : normalizedTheme === "dark"
                      ? "#0f172a"
                      : "#f8fafc",
                );
                document.documentElement.style.setProperty(
                  "--zcode-bootstrap-fg",
                  typeof snapshot.foreground === "string"
                    ? snapshot.foreground
                    : normalizedTheme === "dark"
                      ? "#e2e8f0"
                      : "#334155",
                );
                if (typeof snapshot.border === "string") {
                  document.documentElement.style.setProperty(
                    "--zcode-bootstrap-border",
                    snapshot.border,
                  );
                }
                if (typeof snapshot.card === "string") {
                  document.documentElement.style.setProperty(
                    "--zcode-bootstrap-card",
                    snapshot.card,
                  );
                }
              }
            } catch {
              // ignore invalid snapshot
            }
          }

          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : normalizeResolvedTheme(saved);
          const fallbackTheme = resolved === "dark" ? "dark" : "light";
          const finalTheme = bootstrapTheme ?? fallbackTheme;
          document.documentElement.setAttribute("data-zcode-bootstrap-theme", finalTheme);
          syncBrowserThemeSurface(finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.setAttribute("data-zcode-bootstrap-theme", "dark");
          syncBrowserThemeSurface("dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--zcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-zcode-bootstrap-theme="light"] body {
        background: var(--zcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-zcode-browser-theme-surface],
      html[data-zcode-browser-theme-surface] body,
      html[data-zcode-browser-theme-surface] #root {
        /* 修复原因：共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--zcode-bootstrap-bg, #161616)) !important;
      }

      html[data-zcode-browser-theme-surface="light"],
      html[data-zcode-browser-theme-surface="light"] body,
      html[data-zcode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--zcode-bootstrap-bg, #f8f8f8)) !important;
      }

      .zcode-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* Bugfix: UI 全局样式会把 body/#root 置为透明，预渲染壳必须自己承接主题背景，否则深色主题会露出浏览器白底。 */
        background: var(--zcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-zcode-bootstrap-theme="light"] .zcode-boot-loading {
        background: var(--zcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      .zcode-boot-loading__logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
      }

      .zcode-boot-loading__logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 修复原因：启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。 */
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .zcode-boot-loading__logo {
        width: 56px;
        height: auto;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Bugfix: 远程控制跨 workspace 时会整页跳转；在 JS 入口执行前先给出 loading 壳，避免出现白屏空档。 -->
      <div
        class="zcode-boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading..."
      >
        <div class="zcode-boot-loading__logo-shell">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="56px"
            height="56px"
            viewBox="0 0 512 512"
            class="zcode-boot-loading__logo"
            aria-hidden="true"
          >
            <!-- 纸飞机品牌包 mark-inverse（白翼 + 薄荷翼，透明底），承托在深色启动壳上。 -->
            <g transform="translate(0 55)">
              <path fill="#FFFFFF" d="M40 142 472 48 170 243 182 354 151 242Z">
                <animate
                  attributeName="opacity"
                  dur="1.5s"
                  repeatCount="indefinite"
                  values="1;0.3;1"
                />
              </path>
              <path fill="#49CCA2" d="M204 253 472 48 358 350Z">
                <animate
                  attributeName="opacity"
                  begin="0.75s"
                  dur="1.5s"
                  repeatCount="indefinite"
                  values="1;0.3;1"
                />
              </path>
              <path fill="#FFFFFF" d="M199 259 254 297 187 354Z">
                <animate
                  attributeName="opacity"
                  dur="1.5s"
                  repeatCount="indefinite"
                  values="1;0.3;1"
                />
              </path>
            </g>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
